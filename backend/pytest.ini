[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q --cov=app --cov-report=term-missing --cov-fail-under=70

[coverage:run]
source = app
omit =
    app/db/migrations/*
    app/main.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if TYPE_CHECKING:
