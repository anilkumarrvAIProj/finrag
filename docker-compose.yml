
x-common-env: &common-env
  env_file: .env
  environment:
    - PYTHONUNBUFFERED=1

services:
  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    <<: *common-env
    ports:
      - "7200:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Celery Workers ───────────────────────────────────────────────────────
  worker-ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    <<: *common-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
      - minio
    command: celery -A app.workers.tasks.celery_app worker -Q ingestion -c 4 --loglevel=info

  worker-embedding:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    <<: *common-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
      - weaviate
    command: celery -A app.workers.tasks.celery_app worker -Q embedding -c 2 --loglevel=info

  worker-ocr:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    <<: *common-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
    command: celery -A app.workers.tasks.celery_app worker -Q ocr -c 2 --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: 0  # set to 1 if GPU available

  # ─── Celery Beat (scheduler) ─────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    <<: *common-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info

  # ─── Flower (Celery monitor) ─────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    <<: *common-env
    ports:
      - "7304:5555"
    depends_on:
      - redis
    command: celery -A app.workers.tasks.celery_app flower --port=5555



  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: finrag
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag_dev_pw
    ports:
      - "7300:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "7301:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Weaviate ─────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    ports:
      - "7302:8080"
      - "7303:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: weaviate
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate

  # ─── MinIO (S3-compatible) ────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "7305:9000"
      - "7306:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ─── MinIO bucket bootstrap ───────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/finrag-raw;
      /usr/bin/mc mb --ignore-existing local/finrag-processed;
      /usr/bin/mc anonymous set none local/finrag-raw;
      /usr/bin/mc anonymous set none local/finrag-processed;
      echo 'Buckets ready.';
      "

  # ─── Nginx reverse proxy (disabled in dev - frontends run directly on 3000/3001)
  # nginx:
  #   image: nginx:alpine

  # ─── Admin Portal ─────────────────────────────────────────────────────────
  admin-portal:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    ports:
      - "7100:80"
    environment:
      - VITE_API_URL=http://localhost:7200

  # ─── Chat UI ──────────────────────────────────────────────────────────────
  chat-ui:
    build:
      context: ./frontend/chat
      dockerfile: Dockerfile
    ports:
      - "7101:80"
    environment:
      - VITE_API_URL=http://localhost:7200

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "7307:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "7308:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: finrag-network
