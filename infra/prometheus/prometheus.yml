global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'finrag-monitor'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'finrag-api'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  - job_name: 'celery-workers'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'weaviate'
    static_configs:
      - targets: ['weaviate:2112']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
